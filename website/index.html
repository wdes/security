<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wdes - Security Tools</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>Security Tools</h1>
            </div>
        </nav>
    </header>

    <main>
        <section class="tools-section">
            <div class="tools-grid">
                <div class="tool-card">
                    <i>
                        <svg style="height: 5rem;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>shield-alert-outline</title><path d="M21,11C21,16.55 17.16,21.74 12,23C6.84,21.74 3,16.55 3,11V5L12,1L21,5V11M12,21C15.75,20 19,15.54 19,11.22V6.3L12,3.18L5,6.3V11.22C5,15.54 8.25,20 12,21M11,7H13V13H11V7M11,15H13V17H11V15Z" /></svg>
                    </i>
                    <h3>Report Abusive IP</h3>
                    <p>Report suspicious activity from an IP address</p>
                    <button class="tool-button" id="reportIpBtn">Report IP</button>
                </div>
                <div class="tool-card">
                    <i>
                        <svg style="height: 5rem;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>shield-search</title><path d="M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9M17.86,19.31C16.23,21.22 14.28,22.45 12,23C9.44,22.39 7.3,20.93 5.58,18.63C3.86,16.34 3,13.8 3,11V5L12,1L21,5V11C21,13.39 20.36,15.61 19.08,17.67L16.17,14.76C16.69,13.97 17,13 17,12A5,5 0 0,0 12,7A5,5 0 0,0 7,12A5,5 0 0,0 12,17C13,17 13.97,16.69 14.76,16.17L17.86,19.31Z" /></svg>
                    </i>
                    <h3>Scan</h3>
                    <p>Check an IP or IP Range for scanning infrastructure</p>
                    <button class="tool-button" id="scanBtn">Start Scan</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025-2026 Wdes SAS.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
